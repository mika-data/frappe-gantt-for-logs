<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Task Timeline</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .bar.success { fill: green !important; }
    .bar.failed { fill: red !important; }
    .bar.skipped { fill: gray !important; }
  </style>
    <!-- Include Frappe Gantt CSS -->
    <link rel="stylesheet" href="/Users/mcieslik/Programming/LBBW/JobMonitoring/gantt/dist/frappe-gantt.css" />
</head>
<body>
  <h1>Job Runs - Gantt Chart</h1>
  <div class="side-header">
    <label for="view-mode">View Mode:</label>
    <select id="view-mode" class="viewmode-select">
      <option value="Second">Second</option>
      <option value="Minute">Minute</option>
      <option value="Hour">Hour</option>
      <option value="Day" selected>Day</option>
      <option value="Week">Week</option>
      <option value="Month">Month</option>
      <option value="Year">Year</option>
    </select>
  </div>
  <div id="gantt"></div>
  <!--script type="module" src="/Users/mcieslik/Programming/LBBW/JobMonitoring/gantt/dist/frappe-gantt.es.js"></script-->
  <script src="/Users/mcieslik/Programming/LBBW/JobMonitoring/gantt/dist/frappe-gantt.umd.js"></script>
  </script>
  <script>
    /**
    var tasks = [
      { id: 'task1', name: 'Job A', start: '2025-04-30T08:00:00', end: '2025-04-30T08:30:00', custom_class: 'success' },
      { id: 'task2', name: 'Job B', start: '2025-04-30T08:10:00', end: '2025-04-30T08:40:00', custom_class: 'failed' }
    ];
    */

    async function loadTasksFromTSV() {
      const response = await fetch('/Users/mcieslik/Programming/LBBW/JobMonitoring/data/Jobs_Log.tsv');
      const tsvText = await response.text();
      const lines = tsvText.trim().split('\n');

      //console.log(lines);
      const tasks = lines.slice(1).map(line => {
        const [id, name, startStr, endStr, statusStr] = line.split('\t');
        if (name.includes('XENTIS')) {
          console.log("XENTIS-Name: " + name + " Start: " + startStr + " End: " + endStr + " Status:" + statusStr); // Strings
        }

        //Convert start and end to ISO format
        const startDate = new Date(startStr.replace(/(\d{4})\-(\d{2})\-(\d{2}) (\d{2}):(\d{2}):(\d{2})/, 
                                                  '$1-$2-$3T$4:$5:$6'));
        let endDate = startDate; // Default to start date if end is not provided
        let startISO = "";
        try{
          startISO = startDate.toISOString(); // Handle null or undefined start date
        } catch (error) {
          console.error("Error converting start date to ISO format:", error);
        } 
        let endISO = startISO;
        if (endStr != null && endStr.length > 0) { // Convert it to ISO format
          endISO = endDate.toISOString(); // Handle null or undefined end date
          endDate   = new Date(  endStr.replace(/(\d{4})\-(\d{2})\-(\d{2}) (\d{2}):(\d{2}):(\d{2})/, 
                                                  '$1-$2-$3T$4:$5:$6'));
        }
        duration = endDate - startDate; // Duration in milliseconds
        // console.log("Converted Start: " + startISO + " End: " + endISO 
        // + " Duration (mins): " + (duration/(1000*60))); // ISO format
        let custom_class = '';
        if (statusStr.toUpperCase().includes('SUCCEED')) { custom_class = 'success';}
        else if ((statusStr.toUpperCase().includes('FAIL')) || (statusStr.toUpperCase().includes('ERR')))
           { custom_class = 'failed'; }
        else if (statusStr === 'skipped') custom_class = 'skipped';
        else if (statusStr.toUpperCase().includes('EXEC')) { custom_class = 'running'; }
        else if (statusStr === 'waiting') custom_class = 'waiting';
        else if (statusStr === 'aborted') custom_class = 'aborted';
        else if (statusStr === 'stopped') custom_class = 'stopped';
        else if (statusStr === 'unknown') custom_class = 'unknown';
        else if (statusStr === 'not started') custom_class = 'not-started';
        else if (statusStr === 'in progress') custom_class = 'in-progress';
        else if (statusStr === 'completed') custom_class = 'completed';

        //const resolvedEnd = end || start; // Use start time, if end is missing
        const resolvedEnd = endDate;
        // console.log("Returning: " + id + " Name: " + name + " Start: " + startDate.toISOString()
        // + " End: " + resolvedEnd.toISOString() + " Custom Class: " + custom_class); // ISO format
        const start = startDate;
        const end = resolvedEnd;
        const status = custom_class;
        return { id, name, start, end, status };
      });
      return tasks;
    }

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function setQueryParam(param, value) {
      const urlParams = new URLSearchParams(window.location.search);
      if (value) {
        urlParams.set(param, value);
      } else {
        urlParams.delete(param);
      }
      const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
      window.history.replaceState(null, '', newUrl);
    }

    loadTasksFromTSV().then(tasks => {
      const initialViewMode = document.getElementById('view-mode').value || "Day"; // Get initial view mode from selector
      const gantt = new Gantt("#gantt", tasks, {
        view_mode: initialViewMode, // Use the initial view mode
        custom_popup_html: function (task) {
          // Optional: Add a custom popup to show detailed timestamps
          return `
            <div class="details-container">
              <h5>${task.name}</h5>
              <p>Start: ${task.start.toLocaleString()}</p>
              <p>End: ${task.end.toLocaleString()}</p>
            </div>
          `;
        }
      });

      // Store the original dataset for filtering
      gantt.original_tasks = tasks;

      // Ensure the filter input retains its value
      const filterInput = document.querySelector('.task-filter-input');
      const savedFilter = getQueryParam('filter');
      if (savedFilter) {
        filterInput.value = savedFilter;
        gantt.filter_tasks(savedFilter.toLowerCase());
      }

      filterInput.addEventListener('blur', () => {
        const filterText = filterInput.value.trim();
        setQueryParam('filter', filterText);
      });

      filterInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const filterText = filterInput.value.trim();
          setQueryParam('filter', filterText);
        }
      });

      // Handle view mode change
      document.getElementById('view-mode').addEventListener('change', (event) => {
        gantt.change_view_mode(event.target.value);
      });
    });

  </script>
</body>
</html>
